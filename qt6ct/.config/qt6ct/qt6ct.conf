[Appearance]
# This is the one the shell itself reads: quickshell is a Qt app, and
# QT_QPA_PLATFORMTHEME=qt6ct (hypr/.config/hypr/environment.lua) makes qt6ct
# the source of QIcon's theme - so the dock's icons come from here, not from
# the gtk settings. Keep it the same as gtk/.config/gtk-*/settings.ini.
icon_theme=Papirus-Dark
style=Fusion
custom_palette=true
color_scheme_path=/usr/share/qt6ct/colors/darker.conf
