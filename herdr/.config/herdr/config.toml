onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
prefix = "ctrl+space"

split_vertical   = ["prefix+v"]
split_horizontal = ["prefix+minus", "prefix+s"]

focus_pane_left  = ["prefix+h"]
focus_pane_down  = ["prefix+j"]
focus_pane_up    = ["prefix+k"]
focus_pane_right = ["prefix+l"]

swap_pane_left  = ["prefix+shift+h"]
swap_pane_down  = ["prefix+shift+j"]
swap_pane_up    = ["prefix+shift+k"]
swap_pane_right = ["prefix+shift+l"]

zoom        = ["prefix+f"]
resize_mode = ["prefix+r"]
copy_mode   = ["prefix+space"]
close_pane  = ["prefix+x"]

next_tab     = ["prefix+]"]
previous_tab = ["prefix+["]
new_tab      = ["prefix+n"]

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/.config/herdr/scripts/spawn-pane.sh 'zsh -lc claude'"
description = "claude (novo pane)"

[[keys.command]]
key = "prefix+g"
type = "shell"
command = "~/.config/herdr/scripts/spawn-pane.sh lazygit"
description = "lazygit (novo pane)"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "~/.config/herdr/scripts/project-layout.sh"
description = "project layout"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "~/.config/herdr/scripts/project-layout.sh --tools"
description = "project layout + tools"
