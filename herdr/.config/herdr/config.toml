onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
prefix = "ctrl+space"

split_vertical   = ["prefix+v"]        # como seu antigo w-table v
split_horizontal = ["prefix+minus", "prefix+s"]  # como seu antigo w-table s

focus_pane_left  = ["prefix+h"]
focus_pane_down  = ["prefix+j"]
focus_pane_up    = ["prefix+k"]
focus_pane_right = ["prefix+l"]

swap_pane_left  = ["prefix+shift+h"]
swap_pane_down  = ["prefix+shift+j"]
swap_pane_up    = ["prefix+shift+k"]
swap_pane_right = ["prefix+shift+l"]

zoom        = ["prefix+f"]      # seu bind -r f
resize_mode = ["prefix+r"]      # dentro do modo, h/j/k/l redimensionam
copy_mode   = ["prefix+space"]  # como seu bind Space
close_pane  = ["prefix+x"]      # como seu b-table d

next_tab     = ["prefix+]"]
previous_tab = ["prefix+["]
new_tab      = ["prefix+n"]

[[keys.command]]
key = "prefix+alt+a"
type = "pane"
command = "zsh -lc claude"
description = "claude (novo pane)"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "lazygit (novo pane)"

[[keys.command]]
key = "prefix+alt+o"
type = "shell"
command = "~/.config/herdr/scripts/project-layout.sh"
description = "project layout"

[[keys.command]]
key = "prefix+alt+shift+o"
type = "shell"
command = "~/.config/herdr/scripts/project-layout.sh --tools"
description = "project layout + tools"
