#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# Based on nftables' stock "simple & safe" example, with two changes:
#
# 1. Stealth: unsolicited traffic is dropped silently instead of rejected,
#    and ping (icmp/icmpv6 echo-request) gets no reply - so a probe from
#    outside sees nothing, not "closed". ICMPv6 still accepts the specific
#    types IPv6 needs to function at all (neighbor discovery, path MTU) -
#    those aren't an entry point, blocking them wholesale breaks IPv6 itself.
#
# 2. The forward chain explicitly accepts Docker's bridge interfaces. A
#    published container port (docker-compose "ports:") arrives via the
#    forward hook after DNAT, not input - a default-drop forward chain with
#    no exception here silently breaks every published port docker-compose
#    brings up.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, packet-too-big, time-exceeded, destination-unreachable, parameter-problem } accept comment "required for IPv6 itself, not an entry point"
    tcp dport ssh accept comment "allow sshd, if it's ever enabled"
    counter drop comment "stealth: silent drop, no reject and no ping reply"
  }

  chain forward {
    type filter hook forward priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iifname "docker0" accept comment "docker default bridge"
    oifname "docker0" accept comment "docker default bridge"
    iifname "br-*" accept comment "docker-compose per-project bridges"
    oifname "br-*" accept comment "docker-compose per-project bridges"
  }
}
