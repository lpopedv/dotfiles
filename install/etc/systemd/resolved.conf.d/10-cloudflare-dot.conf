# Cloudflare DNS over TLS, IPv4 and IPv6.
#
# The #hostname suffix is not a comment - systemd-resolved uses it to verify
# the resolver's TLS certificate. Without it DNSOverTLS cannot authenticate
# the server and the connection is refused.
#
# Domains=~. routes every lookup to these servers, so DNS handed out by DHCP
# is never consulted. FallbackNTP-style fallbacks are cleared for the same
# reason: a fallback to an unencrypted resolver defeats the point.

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
FallbackDNS=
Domains=~.
DNSOverTLS=yes
DNSSEC=allow-downgrade
