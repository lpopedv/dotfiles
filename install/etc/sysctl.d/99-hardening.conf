# Closes a few kernel information/attack-surface leaks. Costs nothing in
# normal desktop use, except yama.ptrace_scope (noted below).
#
# dmesg_restrict: without it, any unprivileged process can read the kernel
# log, which can leak memory addresses and driver/hardware details.
kernel.dmesg_restrict=1
# kptr_restrict=2: hides kernel pointers from /proc for unprivileged
# processes - those pointers make kernel exploits easier to build.
kernel.kptr_restrict=2
# sysrq=0: disables the Alt+SysRq key combos, which let anyone with
# physical keyboard access reboot, force a disk sync, or kill processes
# with no authentication at all.
kernel.sysrq=0
# yama.ptrace_scope=2: only root can ptrace - no process, not even one of
# your own, can inspect another process's memory unless it's root. Arch's
# default is 1 (a process can only ptrace its own children), which already
# blocks the realistic threat (malware reading your browser's memory) - 2
# closes the gap further, at the cost of needing sudo for gdb/strace/ltrace
# on a process you didn't spawn as that debugger's own child. Doesn't
# affect BEAM/Elixir tooling (iex, :observer, :dbg) - that's VM-level
# introspection, not OS ptrace.
kernel.yama.ptrace_scope=2
