# Small records of what was opened or browsed, wiped every time the user
# manager starts (boot / first login). Applied by systemd-tmpfiles-setup.service
# (user), which bootstrap.sh enables. Thumbnails need no entry: ~/.cache is tmpfs.

# File-manager metadata: per-file positions/emblems and starred files.
R %h/.local/share/gvfs-metadata
R %h/.local/share/nautilus/tags
# GTK "recent files" list.
r %h/.local/share/recently-used.xbel
# Previous session's compositor log.
r %h/.local/share/sddm/wayland-session.log
