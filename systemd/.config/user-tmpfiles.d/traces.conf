# Records of what was opened, edited or typed, kept out of the disk. Applied
# by systemd-tmpfiles-setup.service (user) at every user-manager start (first
# login after boot), which bootstrap.sh enables. Thumbnails need no entry:
# ~/.cache is tmpfs.

# Volatile state: each path below becomes a symlink into $XDG_RUNTIME_DIR
# (RAM, removed at logout/reboot). L+ replaces whatever is there - including
# the old on-disk copy - with the link. Targets are created first: programs
# can't mkdir through a dangling symlink.
d %t/state 0700 - - -
d %t/state/nvim 0700 - - -
d %t/state/lazygit 0700 - - -
d %t/state/sddm 0700 - - -
d %t/state/herdr-snapshots 0700 - - -
d %t/state/chromium 0700 - - -
# Neovim: shada (opened files, registers/yanks, command and search history),
# swap files (full buffer contents) and logs.
L+ %h/.local/state/nvim - - - - %t/state/nvim
# lazygit: recently opened repositories, PR cache.
L+ %h/.local/state/lazygit - - - - %t/state/lazygit
# sddm writes the session's stdout/stderr to ~/.local/share/sddm/*-session.log
# (always relative to $HOME). It opens it after PAM has started this manager.
L+ %h/.local/share/sddm - - - - %t/state/sddm
# Claude Code: every prompt typed, with project path - never pruned by
# cleanupPeriodDays. Up-arrow recall still works within a boot.
L+ %h/.claude/history.jsonl - - - - %t/state/claude-history.jsonl
# Chromium (fallback browser only): the whole profile - history, cookies,
# logins. Its policy also wipes all of it at exit (bootstrap.sh).
L+ %h/.config/chromium - - - - %t/state/chromium
# herdr: server/client logs and session recovery copies. session.json itself
# stays on disk: it's how herdr restores the workspace after a reboot.
L+ %h/.config/herdr/herdr-server.log - - - - %t/state/herdr-server.log
L+ %h/.config/herdr/herdr-client.log - - - - %t/state/herdr-client.log
L+ %h/.config/herdr/session-snapshots - - - - %t/state/herdr-snapshots

# Wiped at login rather than redirected: owned by gvfsd-metadata/Nautilus,
# whose write patterns a symlink isn't known to survive.
# File-manager metadata: per-file positions/emblems and starred files.
R %h/.local/share/gvfs-metadata
R %h/.local/share/nautilus/tags
# GTK "recent files" list (no longer written: see gtk settings.ini and the
# org.gnome.desktop.privacy keys bootstrap.sh sets; this clears old ones).
r %h/.local/share/recently-used.xbel
