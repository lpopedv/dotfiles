# Headless cava for the Media widget: raw ASCII frames on stdout, no terminal UI.
[general]
bars = 28
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
