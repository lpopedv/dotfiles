[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
# Papirus, not Adwaita: Adwaita only ships icons for GNOME's own apps, so
# everything else falls back to a low-resolution hicolor png and is scaled up.
# Papirus is svg throughout and covers thousands of third-party apps, which is
# what keeps the dock and the launcher sharp at any icon size. The -Dark
# variant differs only in its symbolic icons being light, for dark panels.
gtk-icon-theme-name=Papirus-Dark
