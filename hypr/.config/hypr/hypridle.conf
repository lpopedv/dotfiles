general {
    lock_cmd         = pidof hyprlock || hyprlock  # avoid launching a second lock screen
    before_sleep_cmd = loginctl lock-session       # lock no matter what triggers sleep (timeout, wlogout, lid, etc.)
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake the screen immediately on resume
}

listener {
    timeout    = 300                    # 5 min
    on-timeout = loginctl lock-session  # emits the dbus Lock signal -> general.lock_cmd runs hyprlock
}

listener {
    timeout    = 330                    # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout    = 900              # 15 min
    on-timeout = systemctl suspend  # suspend-to-RAM, not poweroff: resumes fast on power-button press
}
