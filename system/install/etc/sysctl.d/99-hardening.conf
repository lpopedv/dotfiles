kernel.dmesg_restrict=1
kernel.kptr_restrict=2
kernel.sysrq=0
# 2, not Arch's default 1: needs sudo for gdb/strace on a non-child process.
kernel.yama.ptrace_scope=2
# Blocks swapping the running kernel without a reboot (and past Secure Boot).
kernel.kexec_load_disabled=1
# Stops unprivileged users autoloading obscure, historically buggy line disciplines.
dev.tty.ldisc_autoload=0
# 2, not systemd's 1: also covers group-writable sticky dirs, not just world-writable.
fs.protected_fifos=2
fs.protected_regular=2

# A workstation, not a router: never send or honour ICMP redirects.
# Globbed, not all/default: the kernel ORs all with each interface's own value
# for these, and systemd's 50-default.conf already set per-interface ones, so
# all=0 alone leaves eno1 sending redirects. The glob also reaches interfaces
# created later (docker bridges), via systemd's udev sysctl hook.
net.ipv4.conf.*.send_redirects=0
net.ipv4.conf.*.accept_redirects=0
net.ipv6.conf.*.accept_redirects=0
# Strict reverse-path filtering, anti-spoofing. Globbed for the same reason:
# the kernel takes max(all, interface), so all=1 next to systemd's per-interface
# 2 still leaves every existing link loose.
net.ipv4.conf.*.rp_filter=1

# Core dumps of suid binaries can contain data the caller couldn't otherwise
# read. 0 disables them entirely; this machine runs the distro default 2
# (dump still written, only root can read).
fs.suid_dumpable=0
# Symlink/hardlink attack protection is default-on in the kernel already, but
# pinned explicitly so a future kernel or config change can't quietly undo it.
fs.protected_symlinks=1
fs.protected_hardlinks=1
# perf is a well-known side-channel/speculation readout. 3 restricts perf
# counters to root (this machine runs the distro default 2, which still allows
# self/pid scoping); drop back to 2 if you need to perf unprivileged processes.
kernel.perf_event_paranoid=3
