# Dropped into every .network as <name>.network.d/10-no-dhcp-dns.conf by
# bootstrap.sh, so no interface registers the DNS servers its DHCP lease
# advertises. Resolution then always goes through the Cloudflare servers in
# resolved.conf.d, over TLS.

[DHCPv4]
UseDNS=false

[DHCPv6]
UseDNS=false

[IPv6AcceptRA]
UseDNS=false
