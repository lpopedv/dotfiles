# Cloudflare DNS over TLS, IPv4 and IPv6, as the *global* resolver.
#
# The #hostname suffix is not a comment - systemd-resolved verifies the
# resolver's TLS certificate against it. Without it DNSOverTLS cannot
# authenticate the server and the connection is refused.
#
# Deliberately no "Domains=~.". Global servers are only consulted when no
# link offers its own, which produces the behaviour we want on a machine
# running a VPN:
#
#   VPN up    -> the tunnel's resolver wins, so no third party outside the
#                VPN provider learns anything.
#   VPN down  -> falls through to Cloudflare over TLS instead of whatever
#                DHCP handed out.
#
# The ISP's resolver never enters the picture either way, because the
# no-dhcp-dns.conf drop-in stops links from registering DHCP-advertised
# servers at all. FallbackDNS is cleared for the same reason: falling back
# to an unencrypted resolver would defeat the exercise.

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
