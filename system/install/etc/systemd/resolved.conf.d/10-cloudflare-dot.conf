# The #hostname suffix below is NOT a comment - resolved needs it to verify
# the resolver's TLS cert. No Domains=~.: lets a VPN's own resolver win while
# it's up. FallbackDNS cleared so it never falls back to an unencrypted one.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
