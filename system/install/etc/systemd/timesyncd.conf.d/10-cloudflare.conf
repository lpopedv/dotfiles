# Cloudflare's NTP service. It is anycast, so time.cloudflare.com resolves to
# whichever site is closest.
#
# The Arch pool stays as a fallback: timesyncd only reaches for FallbackNTP
# when the primary is unreachable, and having no fallback at all means a
# machine with an unsynchronised clock and no time source.

[Time]
NTP=time.cloudflare.com
FallbackNTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org 2.arch.pool.ntp.org
