# NetworkManager's dns=systemd-resolved plugin (the default whenever resolved
# is active) pushes every connection's DHCP/RA-advertised DNS servers into
# resolved as that link's own resolvers - the same leak no-dhcp-dns.conf
# closes for systemd-networkd, but for NetworkManager-managed links, which is
# what archinstall's nm_iwd network_config actually sets up here.
#
# dns=none stops NetworkManager from touching resolved's per-link config at
# all, so a link with no VPN offers no DNS servers of its own and resolved
# falls through to the global Cloudflare-over-TLS servers in
# resolved.conf.d - matching the behaviour the DNS-over-TLS drop-in already
# assumes. Mullvad's own tunnel interface manages its resolver separately and
# is unaffected by this.
[main]
dns=none
