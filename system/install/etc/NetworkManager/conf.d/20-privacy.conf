# A new network identity every boot: MAC, DHCP client id, DHCPv6 DUID and the
# IPv6 address are all derived from stable-id, which changes with ${BOOT} -
# stable within a boot (no reconnect churn), unlinkable across boots. The
# hostname is never sent to DHCP servers.
#
# Wi-Fi MACs are NOT set here: with wifi.backend=iwd NetworkManager ignores its
# own MAC options - see /etc/iwd/main.conf.
[connection]
connection.stable-id=${CONNECTION}/${BOOT}
ethernet.cloned-mac-address=stable
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=stable-uuid
ipv6.addr-gen-mode=stable-privacy
# 2: prefer temporary (rotating) IPv6 addresses for outgoing connections.
ipv6.ip6-privacy=2
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false

# No connectivity check: every 5 min, in plain HTTP, it fetches
# ping.archlinux.org from whatever network this is on - a beacon announcing an
# Arch machine. Captive portals (hotel/airport Wi-Fi) are still detected by the
# browser's own check, which shows the login page.
[connectivity]
enabled=false
