# NetworkManager drives Wi-Fi through iwd and ignores its own MAC options, so
# randomization is iwd's job. "once": a fresh random MAC whenever iwd starts
# (each boot), matching the per-boot identity NetworkManager/conf.d/20-privacy
# gives wired links. "full": all 48 bits, not just the NIC half.
[General]
AddressRandomization=once
AddressRandomizationRange=full
