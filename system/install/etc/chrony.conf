# Time over NTS (RFC 8915): every source is authenticated, so a network
# attacker can't shift the clock - TLS, DNSSEC and certificate expiry checks
# all depend on it. systemd-timesyncd can't do NTS; Ubuntu made the same switch
# in 25.10. Replaces the package's /etc/chrony.conf (updates land as .pacnew).

# Four independent operators (Cloudflare, NIC.br/Observatório Nacional, Netnod,
# PTB), so one wrong or hijacked source is outvoted, not followed.
server time.cloudflare.com iburst nts
server a.st1.ntp.br iburst nts
server c.st1.ntp.br iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
# Never fall back to an unauthenticated source; need two agreeing ones.
authselectmode require
minsources 2
# NTS is TLS: a dead RTC battery (clock years off) would fail every certificate
# check and time could never be fixed. Skips the validity-date check only until
# the first clock update.
nocerttimecheck 1

driftfile /var/lib/chrony/drift
# NTS cookies: reconnect after a reboot without a new TLS handshake.
ntsdumpdir /var/lib/chrony
leapseclist /usr/share/zoneinfo/leap-seconds.list
# Step the clock if it's more than 1 s off, only in the first 3 updates; slew after.
makestep 1.0 3
rtcsync
# No UDP control port (chronyc still works, as root, over the Unix socket).
cmdport 0
