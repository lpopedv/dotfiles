# Kernel lockdown, integrity mode. Secure Boot only verifies the kernel; without
# this, root can still change it at runtime (unsigned modules, /dev/mem, MSR
# writes, ACPI table overrides, hibernation images, kprobes writing user memory)
# and the chain of trust ends at boot. Arch doesn't enable it with Secure Boot.
#
# Only signed modules load. Arch signs every module it ships with the kernel,
# but not out-of-tree ones (nvidia, nvidia-open, virtualbox-host-modules-arch,
# broadcom-wl, anything DKMS): bootstrap.sh installs this file only when the
# machine has none, and removes it again otherwise.
#
# Not confidentiality: that also blocks perf, kprobes and BPF tracing reads.
lockdown=integrity
