# systemd 262 bug (github.com/systemd/systemd/issues/43848): on a UKI boot -
# which systemd-stub measures into the TPM, so the OS counts as "measured" -
# its NvPCRs now need a signed PCR policy embedded by ukify. mkinitcpio's UKI
# has none, so systemd-tpm2-setup-early, systemd-pcrproduct and
# systemd-pcrlogin@ fail on every boot. Fixed upstream for 262.1/263 (#43948).
#
# Turning off measured-OS mode skips those units cleanly. Nothing here uses
# TPM measurements: no disk encryption, no TPM-sealed secrets, no attestation.
# Secure Boot is unaffected (firmware-enforced, not TPM-based).
systemd.tpm2_measured_os=0
