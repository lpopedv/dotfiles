# Merged into the Unified Kernel Image by mkinitcpio, which concatenates
# /etc/cmdline.d/*.conf (sorted) and strips '#' lines. Sorts after
# 10-root.conf (the machine-specific root=), so it never clobbers that.
#
# Memory hygiene - the "amnesic" property at the page level. Does not overlap
# with disk encryption (which is a separate concern); this is about what stays
# in RAM after a process releases it.
#
# init_on_alloc: already Arch's build default
# (CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y), pinned here explicitly so a future
# config change can't quietly turn it off.
init_on_alloc=1
# init_on_free: the meaningful one here. Zero pages when they are returned to
# the allocator, so passphrases/keys that got unlocked into RAM don't survive
# in reused pages after the owning process exits.
init_on_free=1
# Free-page allocator shuffling: compiled in (CONFIG_SHUFFLE_PAGE_ALLOCATOR=y)
# and default-on, pinned for the same future-proofing reason as init_on_alloc.
page_alloc.shuffle=1
# Slab merging is default-on (CONFIG_SLAB_MERGE_DEFAULT=y): the kernel reuses
# identical slab objects across unrelated allocations, a standing vector for
# kernel-address disclosure. nomerge turns it off.
slab_nomerge
#
# Attack-surface reduction (KSPP). Every parameter is hardware-agnostic - this
# file ships to every machine this repo is installed on.
#
# Legacy fixed-address syscall page: Arch's default (xonly) already makes it
# unreadable; none removes it. Only binaries built against glibc < 2.14 (2011)
# still call into it.
vsyscall=none
# debugfs is a kernel-internals interface with a long record of info leaks and
# root-only footguns. off: not even registered (systemd's sys-kernel-debug.mount
# is skipped by its own condition, not failed). tracefs is separate, unaffected.
debugfs=off
# Randomises the kernel stack offset on every syscall. Already Arch's build
# default, pinned like init_on_alloc above.
randomize_kstack_offset=on
#
# DMA isolation. AMD's IOMMU is on by default, Intel's is not on Arch's kernel
# (CONFIG_INTEL_IOMMU_DEFAULT_ON unset) - each option is ignored on the other
# vendor. passthrough=0 pins translated DMA (devices only reach the buffers
# mapped for them) over identity mapping. Thunderbolt/USB4 ports need nothing
# more: the kernel already gives external-facing ports strict invalidation and
# bounce buffers on its own.
intel_iommu=on
iommu.passthrough=0
