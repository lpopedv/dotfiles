# Coredumps hold a full memory snapshot of whatever crashed - same reasoning
# as tmp.conf's shortened ages, applied to /var/lib/systemd/coredump.
#
# The stock rule for this path lives in /usr/lib/tmpfiles.d/systemd.conf.
# tmpfiles applies the entry from the lexicographically latest filename, so
# this file MUST sort after "systemd.conf" or the override never takes effect.
# That's the point of the "zz-" prefix. Overrides the upstream 2w age with 2d.
q /var/lib/systemd/coredump 0755 root root 2d
