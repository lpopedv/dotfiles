#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# Stealth (silent drop, no ping reply): nothing on this machine - host
# services or containers - is reachable from the network.
#
# Containers are the one forwarding case. A published port is DNATed before
# the input chain ever sees it, so it reaches the forward chain instead; only
# connections *started by* a container (or by the host, which never passes
# through forward) are accepted. A port published on 0.0.0.0 - "-p 0.0.0.0:X:Y"
# or a network created before daemon.json's 127.0.0.1 default - therefore
# still stays unreachable from the LAN.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, packet-too-big, time-exceeded, destination-unreachable, parameter-problem } accept comment "required for IPv6 itself, not an entry point"
    counter drop comment "stealth: silent drop, no reject and no ping reply"
  }

  chain forward {
    type filter hook forward priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iifname "docker0" accept comment "connections started by containers: default bridge"
    iifname "br-*" accept comment "connections started by containers: compose/user networks"
    counter drop comment "everything else, published container ports reached from the LAN included"
  }
}
